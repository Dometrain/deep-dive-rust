services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo"]
      interval: 5s
      timeout: 5s
      retries: 5

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: postgres://postgres:postgres@db:5432/todo
      APP_JWT_SECRET: dev-only-secret-change-me
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    ports:
      - "8080:8080"
    # Module 8's readiness check wired in for real: the app service reports
    # healthy only once `/health` (which itself pings Postgres) returns 200 --
    # exactly what a real orchestrator would poll to decide whether to route
    # traffic here. `curl` is present in the runtime image for this (see
    # Dockerfile). Compare with `db`'s `pg_isready` check above: both services
    # now have a *real* readiness probe, not just a running container.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:
