<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo — Live</title>
    <!-- Trunk injects the compiled WASM + JS bundle here automatically; a bin
         crate needs no explicit `data-trunk` link. -->
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
      }
      h1 { font-size: 1.4rem; }
      form { display: flex; gap: 0.5rem; margin: 1rem 0; }
      input {
        flex: 1;
        padding: 0.5rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        font: inherit;
      }
      button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        font: inherit;
        cursor: pointer;
      }
      ul { list-style: none; padding: 0; }
      li {
        padding: 0.6rem 0.8rem;
        border: 1px solid #eee;
        border-radius: 6px;
        margin-bottom: 0.4rem;
      }
      .done { text-decoration: line-through; color: #888; }
      button.link {
        border: 0;
        background: none;
        color: #2563eb;
        padding: 0.2rem 0;
        font-size: 0.9rem;
      }
      .error { color: #b91c1c; }
      .live { color: #16a34a; font-size: 0.85rem; }
    </style>
  </head>
  <body></body>
</html>
