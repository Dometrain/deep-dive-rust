name: CI

# Module 8's applied-for-real CI -- the "and Deployment" half of the module's
# name. Runs formatting, lints, and the *real* integration suite on every push
# and PR, then proves the image builds. Placed at this module's own root, since
# each Deep Dive module is framed as its own standalone repository.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Run the full test suite
        run: cargo test
        # GitHub-hosted `ubuntu-latest` runners already have Docker installed
        # and running, so this app's `testcontainers-modules` integration tests
        # (tasks_test, auth_test, contract_test, and Module 8's health_test)
        # start a throwaway Postgres container per test exactly the way they do
        # on a developer's machine. No CI-specific database setup step needed.

  frontend:
    name: Frontend — fmt, wasm check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend

      - name: Check formatting
        run: cargo fmt --check
        working-directory: frontend

      - name: Type-check against wasm32
        run: cargo check --target wasm32-unknown-unknown
        working-directory: frontend

  docker:
    name: Build the image
    runs-on: ubuntu-latest
    needs: backend
    # Only build the image once the test job is green -- a build that compiles
    # but whose tests fail shouldn't produce an image anyone might deploy.
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t todo-ws-app:${{ github.sha }} .
