[package]
name = "todo-ws-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
cc = "1.0"

[dependencies]
actix-cors = "0.7"
actix-web = "4"
actix-ws = "0.4"
anyhow = "1.0"
argon2 = "0.6"
chrono = { version = "0.4", features = ["serde"] }
config = "0.13"
dotenv = "0.15"
futures-util = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde = { version = "1.0", features = ["derive"] }
# Promoted from `[dev-dependencies]` to a real dependency in Module 7: the
# broadcast path in `routes::tasks::create_task` serializes a `Task` to JSON
# before fanning it out to connected WebSocket clients (see
# `broadcast::Broadcaster`), so `serde_json` is now needed by the shipped
# binary, not just the tests.
serde_json = "1.0"
sqlx = { version = "0.7", features = ["chrono", "migrate", "runtime-tokio", "postgres"] }
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-log = "0.2"
tracing-actix-web = "0.7"
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.33.0"

[dev-dependencies]
# The frontend's API contract crate. Pulled in here only so the contract test
# (`tests/contract_test.rs`) can prove this backend's `models` serialize to
# exactly the JSON shapes `todo-shared` -- and therefore the Leptos frontend
# -- expect, catching a drift between the two at `cargo test` time rather than
# at runtime in the browser.
todo-shared = { path = "shared" }
# Module 7's WebSocket route is the one place in this course that needs a
# real bound TCP socket to test: `actix_web::test::init_service` (used by
# every other test here) never opens one, and a WebSocket handshake genuinely
# requires it. `actix-test` binds a loopback server and `awc` is the client
# that performs the handshake and drives the connection. See
# `routes::websocket`'s own tests.
actix-test = "0.1"
awc = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
# `test-util` (needed for `#[tokio::test(start_paused = true)]`'s virtual
# clock, see `examples::module_4::spawning_async_tasks::tests`) is
# deliberately kept out of the main `[dependencies]` entry above -- with
# Cargo's default resolver, a dev-dependency's extra features apply only to
# test/bench builds, not the release binary this app actually ships. This is
# Module 8's feature-unification lesson (8.3 #2), applied for real: features
# are additive and unify across the whole graph, so a feature enabled only for
# tests belongs *only* in `[dev-dependencies]`.
tokio = { version = "1", features = ["test-util"] }

# Module 8's release-profile lesson (8.3 #1), applied to the binary the
# Dockerfile actually ships (`cargo build --locked --release`). `--release`
# already gives opt-level 3 and drops debug symbols, overflow checks, and
# `debug_assert!`s; these three are the opt-in tuning that trades build time
# for a smaller, faster production binary. Left off the (unprofiled) dev build,
# so the local edit-compile loop stays fast.
[profile.release]
lto = true            # optimise across crate boundaries
codegen-units = 1     # one unit: better optimisation, slower compile
strip = true          # strip symbols from the final binary (smaller image layer)
